name: CI
on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          # Feather (@aleeforoughi/*) installs from GitHub Packages. The packages must grant this repo
          # read access under "Manage Actions access" in each package's settings.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
