name: CI
on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          # Feather (@aleeforoughi/*) installs from GitHub Packages; needs a read:packages token secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
