name: Capability scout
# Weekly, read-only. Reports new, removed or changed Higgsfield public docs and Anthropic models against data/capability-snapshot.json.
# It never edits code or the snapshot: humans update data/capability-snapshot.json by PR after review. Nothing is enabled automatically.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  packages: read # the Feather packages install from GitHub Packages when NPM_TOKEN falls back to GITHUB_TOKEN
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Run the scout
        id: scout
        run: node scripts/capability-scout.mjs --out report.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: without it the LLM model list is skipped
      - name: Create or update the tracking issue
        if: steps.scout.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Capability scout (CI): Higgsfield docs + LLM models"
        run: |
          head -c 60000 report.md > body.md
          number=$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            gh issue comment "$number" --body "The scout found changes again on $(date -u +%F). The issue body is the latest report. Run: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
